<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;border-radius:0!important;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
body{display:flex;flex-direction:column;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}

.display{flex:1;background:#000;display:flex;flex-direction:column;justify-content:flex-end;padding:0 18px 10px;overflow:hidden;}
.hist{font-size:18px;color:#888;text-align:right;min-height:24px;word-break:break-all;}
.num{font-size:clamp(18px,4.6vw,28px);font-weight:300;text-align:right;word-break:break-all;line-height:1.1;
  background:linear-gradient(90deg,#FF0000,#FF7F00,#FFD500,#00C000,#0066FF,#4B0082,#8B00FF);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}

.pad{width:100%;max-width:640px;margin:0 auto;flex-shrink:0;padding:1px;background:#111;
  display:flex;flex-direction:column;gap:7px;}                 /* 7px between sections */
.block{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}

button{
  border:none;cursor:pointer;font-family:inherit;
  font-size:clamp(11px,2.4vw,14px);font-weight:700;color:#000;
  display:flex;align-items:center;justify-content:center;
  height:44px;width:100%;white-space:nowrap;overflow:hidden;
}
button:active{filter:brightness(1.4);}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#000;flex-shrink:0;}
.mind{font-size:14px;font-weight:700;color:#FF7F00;visibility:hidden;}
.histbtn{width:auto;height:auto;padding:7px 14px;font-size:13px;color:#fff;background:#222;font-weight:700;}

/* history panel */
.panel{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;}
.panel.open{display:flex;}
.phead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #222;flex-shrink:0;}
.phead .ttl{font-size:22px;font-weight:700;
  background:linear-gradient(90deg,#FF0000,#FF7F00,#FFD500,#00C000,#0066FF,#4B0082,#8B00FF);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
.phead button{width:auto;height:auto;font-size:14px;font-weight:700;padding:7px 13px;color:#fff;}
.clearbtn{background:#333;margin-right:10px;}
.closebtn{background:#FF0000;}
.plist{flex:1;overflow-y:auto;padding:6px 0;}
.empty{color:#666;text-align:center;padding:48px 16px;font-size:15px;}
.hitem{padding:12px 18px;border-bottom:1px solid #161616;cursor:pointer;}
.hitem:active{background:#111;}
.hitem .he{font-size:15px;color:#888;word-break:break-all;text-align:right;}
.hitem .hr{font-size:26px;font-weight:600;word-break:break-all;text-align:right;
  background:linear-gradient(90deg,#FF0000,#FF7F00,#FFD500,#00C000,#0066FF,#4B0082,#8B00FF);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
</style>
</head>
<body>

<div class="topbar">
  <div class="mind" id="mind">M</div>
  <button class="histbtn" onclick="openHistory()">🕘 History</button>
</div>

<div class="display">
  <div class="hist" id="hist"></div>
  <div class="num" id="num">0</div>
</div>

<div class="pad" id="pad"></div>

<div class="panel" id="panel">
  <div class="phead">
    <span class="ttl">History</span>
    <span>
      <button class="clearbtn" onclick="clearHistory()">Clear</button>
      <button class="closebtn" onclick="closeHistory()">Close</button>
    </span>
  </div>
  <div class="plist" id="plist"></div>
</div>

<script>
/* ---------- rainbow (ROYGBIV order) ---------- */
const STOPS=['#FF0000','#FF7F00','#FFD500','#00C000','#0066FF','#4B0082','#8B00FF'];

/* ---------- state ---------- */
let tokens=[];          // each: {raw, disp}
let radians=false;      // false = DEG, true = RAD
let justEvaled=false;
let mem=0;
let history=[];         // {expr, result}, newest first
let repeatOp=null;      // last operation to repeat when = is pressed again

/* ---------- layout: 7 columns, every row red -> violet ---------- */
// action: ['t',raw,disp] | 'ac' | 'bs' | 'eq' | 'deg' | 'pm' | 'mc' | 'mr' | 'mplus' | 'mminus' | 'ms'
const SECTIONS=[
  // --- Memory ---
  [
    [['MC','mc'],['MR','mr'],['M+','mplus'],['M-','mminus'],['MS','ms'],['AC','ac'],['DEL','bs']]
  ],
  // --- Scientific ---
  [
    [['sin',['t','sin(','sin(']],['cos',['t','cos(','cos(']],['tan',['t','tan(','tan(']],['sin⁻¹',['t','asin(','sin⁻¹(']],['cos⁻¹',['t','acos(','cos⁻¹(']],['tan⁻¹',['t','atan(','tan⁻¹(']],['DEG','deg']],
    [['log',['t','log10(','log(']],['ln',['t','ln(','ln(']],['log₂',['t','log2(','log₂(']],['eˣ',['t','exp(','exp(']],['x²',['t','**2','²']],['x³',['t','**3','³']],['xʸ',['t','**','^']]],
    [['√',['t','sqrt(','√(']],['∛',['t','cbrt(','∛(']],['1/x',['t','inv(','1/(']],['|x|',['t','abs(','abs(']],['n!',['t','fact(','fact(']],['π',['t','PI','π']],['e',['t','E','e']]],
    [['(',['t','(','(']],[')',['t',')',')']],['±','pm'],['%',['t','%','%']],['mod',['t','%','mod']],['÷',['t','/','÷']],['×',['t','*','×']]]
  ],
  // --- Basic ---
  [
    [['1',['t','1','1']],['2',['t','2','2']],['3',['t','3','3']],['4',['t','4','4']],['5',['t','5','5']],['6',['t','6','6']],['+',['t','+','+']]],
    [['7',['t','7','7']],['8',['t','8','8']],['9',['t','9','9']],['0',['t','0','0']],['.',['t','.','.']],['−',['t','-','−']],['=','eq']]
  ]
];

/* ---------- render ---------- */
function makeBtn(def,color){
  const [label,act]=def;
  const b=document.createElement('button');
  b.textContent=(act==='deg')?(radians?'RAD':'DEG'):label;
  b.style.background=color;
  b.onclick=()=>handle(act);
  return b;
}
function render(){
  const pad=document.getElementById('pad');
  pad.innerHTML='';
  SECTIONS.forEach(section=>{
    const block=document.createElement('div');
    block.className='block';
    section.forEach(row=>{
      row.forEach((def,col)=>{
        block.appendChild(makeBtn(def,STOPS[col%7]));   // col 0 = red ... col 6 = violet
      });
    });
    pad.appendChild(block);
  });
}

/* ---------- helpers ---------- */
function trimNum(n){return String(Math.round((n+Number.EPSILON)*1e10)/1e10);}

function evalRaw(raw){
  const dFactor = radians ? '1' : '(Math.PI/180)';
  const body=`
    "use strict";
    const PI=Math.PI, E=Math.E, _d=${dFactor};
    const sin=x=>Math.sin(x*_d), cos=x=>Math.cos(x*_d), tan=x=>Math.tan(x*_d);
    const asin=x=>Math.asin(x)/_d, acos=x=>Math.acos(x)/_d, atan=x=>Math.atan(x)/_d;
    const log10=x=>Math.log10(x), log2=x=>Math.log2(x), ln=x=>Math.log(x);
    const sqrt=x=>Math.sqrt(x), cbrt=x=>Math.cbrt(x), abs=x=>Math.abs(x), exp=x=>Math.exp(x), inv=x=>1/x;
    const fact=x=>{x=Math.round(x); if(x<0||!isFinite(x))return NaN; let r=1; for(let i=2;i<=x;i++)r*=i; return r;};
    return (${raw});
  `;
  return Function(body)();
}
function closeParens(raw){
  const open=(raw.match(/\(/g)||[]).length, close=(raw.match(/\)/g)||[]).length;
  return raw + ')'.repeat(Math.max(0,open-close));
}
function currentValue(){
  if(!tokens.length)return 0;
  try{
    const v=evalRaw(closeParens(tokens.map(t=>t.raw).join('')));
    return (typeof v==='number'&&isFinite(v))?v:null;
  }catch(e){return null;}
}

/* ---------- input handling ---------- */
function handle(act){
  if(act==='ac'){tokens=[];justEvaled=false;repeatOp=null;setHist('');}
  else if(act==='bs'){tokens.pop();justEvaled=false;}
  else if(act==='deg'){radians=!radians;render();}
  else if(act==='eq'){evaluate();}
  else if(act==='pm'){const v=currentValue();if(v!=null){const s=trimNum(-v);tokens=[{raw:s,disp:s}];justEvaled=false;}}
  else if(act==='mc'){mem=0;setHist('');}
  else if(act==='mr'){pushToken(trimNum(mem),trimNum(mem));}
  else if(act==='ms'){const v=currentValue();if(v!=null){mem=v;setHist('M = '+trimNum(mem));justEvaled=true;}}
  else if(act==='mplus'){const v=currentValue();if(v!=null){mem+=v;setHist('M = '+trimNum(mem));justEvaled=true;}}
  else if(act==='mminus'){const v=currentValue();if(v!=null){mem-=v;setHist('M = '+trimNum(mem));justEvaled=true;}}
  else if(Array.isArray(act)&&act[0]==='t'){pushToken(act[1],act[2]);}
  draw();
  updateMind();
}
function pushToken(raw,disp){
  if(justEvaled){
    const isOp=/^[*/+\-%]$|^\*\*/.test(raw);   // operator continues the result; anything else starts fresh
    if(!isOp)tokens=[];
    justEvaled=false;
  }
  tokens.push({raw,disp});
}
function setHist(t){document.getElementById('hist').textContent=t;}
function draw(){
  const disp=tokens.map(t=>t.disp).join('');
  document.getElementById('num').textContent=disp||'0';
}

/* ---------- memory indicator + history viewer ---------- */
function updateMind(){
  const el=document.getElementById('mind');
  el.textContent='M '+(mem?trimNum(mem):'');
  el.style.visibility = (mem!==0) ? 'visible' : 'hidden';
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderHistory(){
  const list=document.getElementById('plist');
  list.innerHTML='';
  if(!history.length){list.innerHTML='<div class="empty">No calculations yet</div>';return;}
  history.forEach(h=>{
    const it=document.createElement('div');
    it.className='hitem';
    it.innerHTML='<div class="he">'+escapeHtml(h.expr)+' =</div><div class="hr">'+escapeHtml(h.result)+'</div>';
    it.onclick=()=>loadHistory(h.result);
    list.appendChild(it);
  });
}
function openHistory(){renderHistory();document.getElementById('panel').classList.add('open');}
function closeHistory(){document.getElementById('panel').classList.remove('open');}
function clearHistory(){history=[];renderHistory();}
function loadHistory(s){tokens=[{raw:s,disp:s}];justEvaled=true;draw();closeHistory();}

/* ---------- repeat-on-equals ---------- */
function isBinaryOp(r,i){
  if(r==='*'||r==='/'||r==='%'||r==='**')return true;
  if(r==='+'||r==='-'){                          // tell apart binary minus from a leading sign
    if(i===0)return false;
    const p=tokens[i-1].raw;
    if(p==='('||['*','/','+','-','%','**'].includes(p))return false;
    return true;
  }
  return false;
}
function captureRepeat(){
  // find the last top-level operator + the operand after it, e.g. "×(3)" in 1×(3)
  let depth=0,opIdx=-1;
  for(let i=0;i<tokens.length;i++){
    const r=tokens[i].raw;
    if(r==='(')depth++;
    else if(r===')')depth--;
    else if(depth===0&&isBinaryOp(r,i))opIdx=i;
  }
  if(opIdx>=0&&opIdx<tokens.length-1){
    repeatOp={opRaw:tokens[opIdx].raw,opDisp:tokens[opIdx].disp,
      operandTokens:tokens.slice(opIdx+1).map(t=>({raw:t.raw,disp:t.disp}))};
  }else{
    repeatOp=null;                               // nothing repeatable (e.g. a lone number)
  }
}

/* ---------- evaluate ---------- */
function evaluate(){
  if(!tokens.length)return;
  if(justEvaled&&repeatOp){
    // = pressed again -> repeat the last operation on the current result
    const cur={raw:tokens[0].raw,disp:tokens[0].disp};
    tokens=[cur,{raw:repeatOp.opRaw,disp:repeatOp.opDisp},
      ...repeatOp.operandTokens.map(t=>({raw:t.raw,disp:t.disp}))];
  }else{
    captureRepeat();                             // remember this op for future = presses
  }
  const exprStr=tokens.map(t=>t.disp).join('');
  const raw=closeParens(tokens.map(t=>t.raw).join(''));
  let result;
  try{
    result=evalRaw(raw);
    if(result===undefined||result===null||Number.isNaN(result))result='Error';
    else if(!isFinite(result))result='∞';
    else result=Math.round((result+Number.EPSILON)*1e10)/1e10;
  }catch(e){result='Error';}
  setHist(exprStr+' =');
  if(result==='Error'||result==='∞'){
    document.getElementById('num').textContent=result;
    tokens=[];justEvaled=false;repeatOp=null;
  }else{
    const s=String(result);
    document.getElementById('num').textContent=s;
    tokens=[{raw:s,disp:s}];
    justEvaled=true;
    history.unshift({expr:exprStr,result:s});   // newest first
  }
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(document.getElementById('panel').classList.contains('open')){
    if(e.key==='Escape')closeHistory();
    return;                       // ignore calc keys while history is open
  }
  const k=e.key;
  if(/[0-9.]/.test(k))handle(['t',k,k]);
  else if(k==='+')handle(['t','+','+']);
  else if(k==='-')handle(['t','-','−']);
  else if(k==='*')handle(['t','*','×']);
  else if(k==='/'){e.preventDefault();handle(['t','/','÷']);}
  else if(k==='(')handle(['t','(','(']);
  else if(k===')')handle(['t',')',')']);
  else if(k==='%')handle(['t','%','%']);
  else if(k==='Enter'||k==='='){e.preventDefault();handle('eq');}
  else if(k==='Backspace')handle('bs');
  else if(k==='Escape')handle('ac');
});

/* ---------- init ---------- */
render();
draw();
updateMind();
</script>
</body>
</html>
